<style>

.sp{display:flex;flex-wrap:wrap;width:100%;overflow:auto;align-content:flex-start}.lst{width:260px;padding:18px 10px;box-sizing:border-box}.lst h2{padding-left:14px}.lst h3{margin:14px 0 4px 14px;font-size:13px;opacity:.55;font-weight:400}.lst button{display:block;width:100%;font-size:17px}

.body{overflow:auto;flex:1;padding:14px 2px}.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}

html,body{background:var(--g2)}
#ov.mn{background:radial-gradient(ellipse at 15% 60%,var(--g1) 0,var(--g2) 70%)}

nav button:hover,.lst .a{background:var(--hv)}
button.o{background:var(--sf)}.kv{border-bottom-color:var(--bd)}
.b.on{background:color-mix(in srgb,var(--ac) 55%,transparent)}
.g{color:var(--ac)}.r{color:#e0786f}

nav .sw button{width:30px;height:30px;padding:0;border-radius:50%;border:2px solid transparent;opacity:1}

.hw{position:relative;width:288px;height:277px;margin:8px auto}

.hx i{position:absolute;inset:2px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--sf);display:flex;flex-direction:column;align-items:center;justify-content:center;font:10px/1.2 Georgia,serif;color:var(--tx);padding:0 14px;text-align:center;overflow-wrap:anywhere}
.hx span{font-size:24px;margin-bottom:3px}
.hx.s,.hx.own{background:var(--ac)}.hx.own i{background:color-mix(in srgb,var(--ac) 30%,var(--g2))}.hx.s:not(.own) i{background:var(--hv)}
.dt{border:1px solid var(--bd);background:var(--sf);padding:12px;margin-top:10px;font-size:14px;line-height:1.6}
.dt h4{margin:0 0 6px;color:var(--ac);font-size:17px}.dt button{width:100%;margin-top:10px;padding:11px;background:var(--ac);color:#10170f;border:0;font:700 15px Georgia,serif}.dt button:disabled{opacity:.35}.dt .ok{display:block;margin-top:8px;color:var(--ac)}
.hw{width:240px;height:194px}
.ml{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.dt .mb{width:auto;margin:0;padding:7px 10px;background:var(--sf);color:var(--tx);border:1px solid var(--bd);font:13px Georgia,serif}
.dt .mb.s{border-color:var(--ac);color:var(--ac)}
#ab{right:calc(26px + env(safe-area-inset-right,0px));bottom:calc(158px + env(safe-area-inset-bottom,0px));width:64px;height:64px;font-size:10px;padding:4px;box-sizing:border-box;background:color-mix(in srgb,var(--ac) 30%,transparent)}
</style></head><body>
<canvas id="c"></canvas>
<div id="js"><div id="kn"></div></div>
<div class="b" id="run">БЕГ</div><div class="b" id="eat">ЕСТЬ<br>ПИТЬ</div><div class="b" id="bite">УКУС</div>
<div class="b" id="ab">Способность</div>
<div class="b" id="tb">☰</div>
<div id="ov"></div>
<script>
const $=id=>document.getElementById(id),R=Math.random,TAU=Math.PI*2,cv=$('c'),g=cv.getContext('2d');
let W,H,Z=1,keys={},P,npcs=[],bushes=[],cars=[],paused=true,last=0,hint='',hold={run:0,eat:0},jv={x:0,y:0},jid=null;
function rs(){cv.width=W=innerWidth;cv.height=H=innerHeight;Z=Math.max(.8,Math.min(1.5,Math.min(W,H)/480))}rs();onresize=rs;
// ---------- КАРТА ----------
const N=100,T=32,WS=N*T,map=new Uint8Array(N*N),col=[],mm=document.createElement('canvas');mm.width=mm.height=N;
const hs=(x,y)=>{let n=Math.sin(x*127.1+y*311.7+9.3)*43758.5453;return n-Math.floor(n)};
function vn(x,y){let xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);return(hs(xi,yi)*(1-u)+hs(xi+1,yi)*u)*(1-v)+(hs(xi,yi+1)*(1-u)+hs(xi+1,yi+1)*u)*v}
const fb=(x,y)=>vn(x*.06,y*.06)*.6+vn(x*.13,y*.13)*.3+vn(x*.3,y*.3)*.1;
(function gen(){const mc=mm.getContext('2d'),mcol=['#1d4a7a','#3a8fb0','#cdb872','#4f7a35','','#2d5a2c','#777'];
for(let y=0;y<N;y++)for(let x=0;x<N;x++){let n=fb(x,y),d=Math.max(Math.abs(x-50),Math.abs(y-50))/50;n-=Math.pow(d,4)*.55;
const m=vn(x*.09+40,y*.09+40),t=n<.37?0:n<.42?1:n<.45?2:n>.74?6:m>.58?5:3,s=hs(x,y);map[y*N+x]=t;
col[y*N+x]=['hsl(212,55%,'+(22+s*6)+'%)','hsl(195,50%,'+(38+s*6)+'%)','hsl(42,45%,'+(60+s*6)+'%)','hsl(92,35%,'+(30+s*6)+'%)','','hsl(112,35%,'+(23+s*5)+'%)','hsl(30,6%,'+(40+s*10)+'%)'][t];
mc.fillStyle=mcol[t];mc.fillRect(x,y,1,1)}})();
const tile=(x,y)=>{x=x/T|0;y=y/T|0;return x<0||y<0||x>=N||y>=N?6:map[y*N+x]},solid=(x,y)=>tile(x,y)==6;
function mv(e,dx,dy){if(!solid(e.x+dx+Math.sign(dx)*e.r*.6,e.y))e.x+=dx;if(!solid(e.x,e.y+dy+Math.sign(dy)*e.r*.6))e.y+=dy}
function rp(far){let x,y,k=0;do{x=R()*WS;y=R()*WS;k++}while(([2,3,5].indexOf(tile(x,y))<0||(far&&P&&Math.hypot(x-P.x,y-P.y)<500))&&k<500);return[x,y]}
// ---------- МУТАЦИИ ----------
const M=[['Толстая шкура','Броня +25%, скорость −8%',{arm:.25,spd:-.08}],['Усиленные сухожилия','Скорость +12%, здоровье −12%',{spd:.12,hp:-.12}],
['Остеосклероз','Здоровье +25%, скорость −10%',{hp:.25,spd:-.1}],['Гемомания','Урон +30%, регенерация −30%',{dmg:.3,reg:-.3}],
['Ксерофил','Жажда −45%, здоровье −10%',{tdec:-.45,hp:-.1}],['Гиперметаболизм','Голод −35%, урон −12%',{hdec:-.35,dmg:-.12}],
['Лёгкие бегуна','Выносливость +40%, броня −10%',{stm:.4,arm:-.1}],['Регенерация','Лечение +60%, голод +25%',{reg:.6,hdec:.25}]];
const m=k=>{let s=1;P.mu.forEach(i=>s+=M[i][2][k]||0);return s};
const maxhp=()=>(60+140*P.gr/100)*m('hp')*S[P.s].hp;
// ---------- МИР ----------
function mkNpc(k,far){const[x,y]=rp(far),ty=k=='p'?[1,4,0,5][R()*4|0]:[2,6,7,3][R()*4|0],r=[16,24,9,14,22,30,13,15][ty];return{x,y,a:R()*TAU,k,ty,c:k=='p'?['#8a2e2e','#7a3a1e','#5a2a40','#6a2020'][R()*4|0]:S[ty].c,r,hp:r*(k=='p'?9:4),cd:0,fl:0,wt:0,sp:1,fear:0,ch:0}}
function start(si){const k=S[si].k;P={s:si,sl:[],acd:0,t:{s:0,d:0,a:0,c:0,b:0},dh:0,pts:0,got:0,age:0,x:0,y:0,a:0,r:8,k,hp:60,st:100,fd:75,wt:75,n:[50,50,50],gr:0,mu:[],cd:0,bt:0,hf:0,dead:false};
let r=0,f=0;for(;!f&&r<50;r++)for(let a=0;a<TAU&&!f;a+=.4){const x=WS/2+Math.cos(a)*r*T,y=WS/2+Math.sin(a)*r*T;if(tile(x,y)==3){P.x=x;P.y=y;f=1}}
npcs=[];for(let i=0;i<34;i++)npcs.push(mkNpc('h',1));for(let i=0;i<7;i++)npcs.push(mkNpc('p',1));
bushes=[];for(let i=0;i<150;i++){const[x,y]=rp(),c=.45+R()*.3,l=.2+R()*.2;bushes.push({x,y,l:60,t:0,r:10,q:[1-c-l,l,c]})}
cars=[];paused=false;tabOn=false;selS=selM=-1;$('ov').className='';$('ov').innerHTML=''}
function menuOld(){$('ov').innerHTML='<div class="box"><h1>Остров мутантов</h1><p>Выживай, питайся, расти и мутируй. На каждой стадии роста выбирай мутацию: у каждой есть цена. Нутриенты усиливают тело: белки — лечение, липиды — выносливость, углеводы — скорость.</p><button class="o" onclick="start(0)">🦖 Хищник<small>Ешь туши добычи. Кусай травоядных.</small></button><button class="o" onclick="start(1)">🦕 Травоядный<small>Ешь кусты. Беги от хищников.</small></button><p style="margin-top:14px;font-size:12px;opacity:.7">WASD — ходьба, Shift — бег, Пробел — укус, E — есть и пить.</p></div>'}
function pick(){paused=true;const o=[];while(o.length<3&&o.length<M.length-P.mu.length){const i=R()*M.length|0;if(P.mu.indexOf(i)<0&&o.indexOf(i)<0)o.push(i)}
$('ov').innerHTML='<div class="box"><h2>Мутация</h2><p>Тело меняется. Выбери одну.</p>'+o.map(i=>'<button class="o" onclick="take('+i+')">'+M[i][0]+'<small>'+M[i][1]+'</small></button>').join('')+'</div>'}
function take(i){P.mu.push(i);P.hp=Math.min(maxhp(),P.hp+30);paused=false;$('ov').innerHTML=''}
function die(){P.dead=true;paused=true;$('ov').innerHTML='<div class="box"><h2>Вы погибли</h2><p>Рост: '+(P.gr|0)+'%. Мутаций: '+P.mu.length+'.</p><button class="o" onclick="menu()">Родиться заново</button></div>'}
function hurt(d){if(P.dead)return;P.hp-=d*(1-Math.max(-.3,Math.min(.7,m('arm')-1)))*(P.t.a>0?.3:1);P.hf=.15;if(P.hp<=0)die()}
function bite(){if(paused||P.dead||P.cd>0)return;P.cd=.6;P.bt=.15;let b=null,bd=1e9;
npcs.forEach(n=>{const d=Math.hypot(n.x-P.x,n.y-P.y);if(d<P.r*2.4+n.r&&d<bd){b=n;bd=d}});
if(b){P.a=Math.atan2(b.y-P.y,b.x-P.x);b.hp-=(P.k?11:18)*S[P.s].dmg*(.5+P.gr/100)*m('dmg')*(P.t.d>0?1.25:1)*(P.t.c>0?3:1);if(P.t.c>0){P.t.c=0;b.stun=1.5}if(P.t.b>0)b.bl=5;b.fl=.12;if(b.k=='h')b.fear=3;else b.ch=1;
if(b.hp<=0){npcs.splice(npcs.indexOf(b),1);cars.push({x:b.x,y:b.y,l:b.k=='p'?220:110,t:100,r:b.r*1.1,q:[.45,.4,.15]});const k=b.k;setTimeout(()=>npcs.push(mkNpc(k,1)),40000)}}}
// ---------- ОБНОВЛЕНИЕ ----------
function upd(dt){const p=P;let ix=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+jv.x,iy=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0)+jv.y,l=Math.hypot(ix,iy);if(l>1){ix/=l;iy/=l;l=1}
p.r=(8+p.gr*.14)*S[p.s].sz;p.age+=dt;p.acd-=dt;for(const k in p.t)p.t[k]-=dt;p.cd-=dt;p.bt-=dt;p.hf-=dt;const mh=maxhp(),ms=100*m('stm'),run=(hold.run||keys.ShiftLeft||keys.ShiftRight)&&l>.1&&p.st>0;
const sp=(p.k?100:115)*S[p.s].spd*(1-p.gr/100*.12)*m('spd')*(1+p.n[2]/100*.12)*(run?1.65:1)*(p.t.s>0?1.6:1)*(tile(p.x,p.y)==0?.5:1);
if(p.dh>0){p.dh-=dt;mv(p,Math.cos(p.a)*400*dt,Math.sin(p.a)*400*dt);const q=npcs.find(n=>Math.hypot(n.x-p.x,n.y-p.y)<p.r+n.r+10);if(q){p.dh=0;dashHit(q)}}else if(l>.1){p.a=Math.atan2(iy,ix);mv(p,ix*sp*dt,iy*sp*dt)}
p.st=run&&p.t.s<=0?Math.max(0,p.st-22*dt):Math.min(ms,p.st+14*(1+p.n[1]/200)*dt);
p.fd=Math.max(0,p.fd-.3*m('hdec')*dt*(run?1.5:1));p.wt=Math.max(0,p.wt-.45*m('tdec')*dt);for(let i=0;i<3;i++)p.n[i]=Math.max(0,p.n[i]-.25*dt);
if(p.fd<=0||p.wt<=0)hurt(2.5*dt);else if(p.fd>30&&p.wt>30)p.hp=Math.min(mh,p.hp+1.2*m('reg')*(1+p.n[0]/100)*dt);
if(p.fd>35&&p.wt>35)p.gr=Math.min(100,p.gr+dt*(.25+.25*(p.n[0]+p.n[1]+p.n[2])/300));
while(p.got<4&&p.gr>=SL[p.got]){p.got++;p.pts++}
// еда и вода
hint='';let tg=null,td=1e9;const src=p.k?bushes:cars;
src.forEach(s=>{if(s.l>0){const d=Math.hypot(s.x-p.x,s.y-p.y);if(d<p.r+s.r+14&&d<td){tg=s;td=d}}});
const wa=tile(p.x,p.y)<2||tile(p.x+Math.cos(p.a)*(p.r+10),p.y+Math.sin(p.a)*(p.r+10))<2;
if(tg){hint=p.k?'Удерживай ЕСТЬ — куст':'Удерживай ЕСТЬ — туша';if(hold.eat||keys.KeyE){const a=Math.min(tg.l,30*dt);tg.l-=a;p.fd=Math.min(100,p.fd+a*.55);for(let i=0;i<3;i++)p.n[i]=Math.min(100,p.n[i]+a*tg.q[i]*1.1);if(tg.l<=0)tg.t=p.k?45:0}}
else if(wa){hint='Удерживай ПИТЬ — вода';if(hold.eat||keys.KeyE)p.wt=Math.min(100,p.wt+35*dt)}
// NPC
npcs.forEach(n=>{n.cd-=dt;n.fl-=dt;n.fear-=dt;n.wt-=dt;n.bl-=dt;if(n.bl>0)n.hp-=8*dt;if(n.stun>0){n.stun-=dt;return}const dx=P.x-n.x,dy=P.y-n.y,d=Math.hypot(dx,dy);let v=0,a=n.a;
if(n.k=='p'){if(d<(n.ch?440:270)){n.ch=1;a=Math.atan2(dy,dx);v=125;if(d<n.r+P.r+8&&n.cd<=0){hurt(n.r*.65);n.cd=1.1}}else n.ch=0}
else if((P.k==0&&d<190)||n.fear>0){a=Math.atan2(-dy,-dx);v=130;n.a=a}

lg.map((l,i)=>[l,i,pt(l[0]*r,l[1]*r)]).sort((p,q)=>p[2][1]-q[2][1]).forEach(([l,i,hp])=>{const s=Math.sin(ph+(i==1||i==2?Math.PI:0)),ft=pt(l[0]*r+s*r*.5,l[1]*r);g.strokeStyle=sh(c,.5);g.lineWidth=r*.42;g.lineCap='round';g.beginPath();g.moveTo(hp[0],hp[1]-r*.65);g.lineTo(ft[0],ft[1]-Math.max(0,-s)*r*.25);g.stroke()});
const tail=()=>{for(let i=6;i>=0;i--){const t=i/6,u=-r*(.9+t*(ty==3?1.8:2.5)),v=Math.sin(t*2+ph*.5)*r*.35*t,q=r*(.5*(1-t)+.1);L(r*(.45-t*.1),()=>{F(.6);el(u,v,q,q*.9)});L(r*(.62-t*.1),()=>{F(.85);el(u,v,q*.9,q*.8)})}},
body=()=>{for(let j=0;j<4;j++)L(r*(.35+.16*j),()=>{F(.58+.13*j);el(0,0,r*1.3*(1-.03*j),r*.8*(1-.05*j))});L(r*.83,()=>{F(.7);for(let s=-1;s<=1;s++)el(s*r*.5,0,r*.12,r*.62*(1-Math.abs(s)*.2));F(1.3);el(r*.15,-r*.2,r*.6,r*.16)})},
head=()=>{const ru=r*[.85,1.05,.55,.85][ty],rv=r*[.45,.6,.34,.5][ty],hz=r*(ty==3?.7:1),hx=r*1.7+ru*.3;
L(r*.75,()=>{F(.8);el(r*1.1,0,r*.55,r*.4)});L(r*.95,()=>{F(.95);el(r*1.4,0,r*.5,r*.38)});
if(ty==3)L(hz+r*.1,()=>{F(.8);el(r*1.35,0,r*.35,r*1.05);F(1.2);el(r*1.35,0,r*.2,r*.8)});
if(ty<3)L(hz-r*.12-(op?r*.2:0),()=>{F(.65);el(hx+ru*.1,0,ru*.9,rv*.75)});
if(op)L(hz-r*.05,()=>{g.fillStyle='#5a1010';el(hx+ru*.2,0,ru*.8,rv*.6)});
L(hz,()=>{F(1.1);el(hx+ru*.15,0,ru,rv)});
if(ty==3)L(hz+r*.15,()=>{g.strokeStyle='#efe6cf';g.lineWidth=r*.18;g.lineCap='round';[-1,1,0].forEach(s=>{g.beginPath();g.moveTo(hx+ru*.5,s*rv*.45);g.lineTo(hx+ru*(s?1.6:1.2),s*rv*(s?.55:0));g.stroke()})});
L(hz+rv*.3,()=>{[-1,1].forEach(s=>{g.fillStyle='#f5e9c0';el(hx-ru*.1,s*rv*.6,r*.14,r*.14);g.fillStyle='#000';el(hx-ru*.05,s*rv*.6,r*.07,r*.07)})})};
const ex=()=>{if(oy==6)L(r*1.15,()=>{g.strokeStyle=sh(c,.75);g.lineWidth=r*.2;g.lineCap='round';g.beginPath();g.moveTo(r*1.9,0);g.lineTo(r*.5,0);g.stroke()});if(oy==7){L(r*.97,()=>{F(1.45);for(let k=-2;k<=2;k++)el(k*r*.45,0,r*.2,r*.55)});L(r*.5,()=>{F(.9);el(-r*2.7,0,r*.5,r*.5)})}};
if(sa<-.1){head();body();tail()}else{tail();body();head()}ex()}
function drawWorld(){bushes.forEach(b=>{if(b.x>CX-30&&b.x<CX+W/Z+30&&b.y>CY-30&&b.y<CY+H/Z/K+30)dr.push([b.y,7,b.x,b.y,b])});
cars.forEach(c=>dr.push([c.y,8,c.x,c.y,c]));npcs.forEach(n=>dr.push([n.y,9,n.x,n.y,n]));dr.push([P.y,10,P.x,P.y,P]);dr.sort((p,q)=>p[0]-q[0]);
dr.forEach(d=>{const t=d[1],x=d[2],y=d[3],o=d[4];g.save();g.translate((x-CX)*Z,(y-CY)*Z*K);g.scale(Z,Z);
if(t==5)tree(x,y);else if(t==6)rock(x,y);else if(t==7)bush(o);else if(t==8)carc(o);
else if(t==9)dino(o.a,o.r,o.c,o.fl,o.ty,0,(x+y)/(o.r*.7));else dino(o.a,o.r,S[o.s].c,o.hf,o.s,o.bt>0,(x+y)/(o.r*.7));g.restore()})}
const det=(i,can)=>{const x=M[i];return'<div class="dt"><h4>'+IC[i]+' '+x[0]+'</h4>'+Object.keys(x[2]).map(k=>{const v=x[2][k],gd=(k=='tdec'||k=='hdec')?v<0:v>0;return'<div class="'+(gd?'g':'r')+'">'+(gd?'+ ':'− ')+ML[k]+' '+(v>0?'+':'−')+Math.round(Math.abs(v)*100)+'%</div>'}).join('')+(can?'<button '+(P.pts>0?'':'disabled')+' onclick="take3()">Мутировать слот '+(selS+1)+'</button>':'')+'</div>'};
function take3(){if(selS<0||selM<0||P.pts<1||P.sl[selS]!=null||P.mu.indexOf(selM)>=0)return;P.sl[selS]=selM;P.mu.push(selM);P.pts--;P.hp=Math.min(maxhp(),P.hp+20);tabUi()}
function hexTab(){const p=P,ps=[[0,0],[96,0],[48,83],[144,83]];
let h='<p class="pts">Очки мутаций: <b>'+p.pts+'</b><small>'+(p.got<4?'Следующий слот откроется на '+SL[p.got]+'% роста':'Все слоты открыты')+'</small></p><div class="hw">'+ps.map((q,i)=>{const mi=p.sl[i],lk=i>=p.got;return'<button class="hx'+(mi!=null?' own':'')+(i==selS?' s':'')+'" style="left:'+q[0]+'px;top:'+q[1]+'px" onclick="selS='+i+';selM='+(mi!=null?mi:-1)+';tabUi()"><i>'+(lk?'<span>🔒</span>'+SL[i]+'%':mi!=null?'<span>'+IC[mi]+'</span>'+M[mi][0]:'<span>＋</span>Свободно')+'</i></button>'}).join('')+'</div>';
if(selS<0)h+='<p style="text-align:center;opacity:.6;font-size:13px">Выбери шестиугольник-слот</p>';
else if(selS>=p.got)h+='<p class="dt">Слот откроется на '+SL[selS]+'% роста.</p>';
else{const mi=p.sl[selS];if(mi==null)h+='<div class="dt"><b>Выбери мутацию</b><div class="ml">'+M.map((x,i)=>p.mu.indexOf(i)>=0?'':'<button class="mb'+(i==selM?' s':'')+'" onclick="selM='+i+';tabUi()">'+IC[i]+' '+x[0]+'</button>').join('')+'</div></div>';
if(selM>=0)h+=det(selM,mi==null)}
return h}
const near=(d,f)=>npcs.filter(n=>Math.hypot(n.x-P.x,n.y-P.y)<d).forEach(f);
const AB=[['Прыжок',10,()=>{P.dh=.3},'рывок вперёд с укусом, урон ×1.8'],['Рёв',20,()=>{P.t.d=6;near(350,n=>{if(n.k=='h')n.fear=5})},'пугает травоядных, урон +25% на 6 с'],['Спурт',15,()=>{P.t.s=5;P.st=100*m('stm')},'скорость +60% на 5 с'],['Таран',14,()=>{P.dh=.35},'таран с оглушением, урон ×2.2'],['Кровотечение',18,()=>{P.t.b=8},'укусы вызывают кровотечение 8 с'],['Сокрушение',22,()=>{P.t.c=8},'следующий укус ×3 и оглушение'],['Зов',22,()=>{P.hp=Math.min(maxhp(),P.hp+25);near(420,n=>{if(n.k=='p'){n.stun=4;n.ch=0}})},'оглушает хищников, лечит 25'],['Панцирь',20,()=>{P.t.a=6},'урон по вам −70% на 6 с']];
function useAb(){if(paused||!P||P.dead||P.acd>0)return;AB[P.s][2]();P.acd=AB[P.s][1]}
function killN(b){const i=npcs.indexOf(b);if(i<0)return;npcs.splice(i,1);cars.push({x:b.x,y:b.y,l:b.k=='p'?220:110,t:100,r:b.r*1.1,q:[.45,.4,.15]});const k=b.k;setTimeout(()=>npcs.push(mkNpc(k,1)),40000)}
