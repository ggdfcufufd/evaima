<script>
const $=id=>document.getElementById(id),R=Math.random,TAU=Math.PI*2,cv=$('c'),g=cv.getContext('2d');
let W,H,Z=1,keys={},P,npcs=[],bushes=[],cars=[],paused=true,last=0,hint='',hold={run:0,eat:0},jv={x:0,y:0},jid=null;
function rs(){cv.width=W=innerWidth;cv.height=H=innerHeight;Z=Math.max(.8,Math.min(1.5,Math.min(W,H)/480))}rs();onresize=rs;
// ---------- КАРТА ----------
const N=160,T=32,WS=N*T,map=new Uint8Array(N*N),FX=new Float32Array(N*N),FY=new Float32Array(N*N),RV=new Uint8Array(N*N),col=[],mm=document.createElement('canvas');mm.width=mm.height=N;
const hs=(x,y)=>{let n=Math.sin(x*127.1+y*311.7+9.3)*43758.5453;return n-Math.floor(n)};

const fb=(x,y)=>vn(x*.06,y*.06)*.6+vn(x*.13,y*.13)*.3+vn(x*.3,y*.3)*.1;
(function gen(){const mc=mm.getContext('2d'),mcol=['#1d4a7a','#3a8fb0','#cdb872','#4f7a35','','#2d5a2c','#777'];
for(let y=0;y<N;y++)for(let x=0;x<N;x++){let n=fb(x,y),d=Math.max(Math.abs(x-N/2),Math.abs(y-N/2))/(N/2);n-=Math.pow(d,4)*.55;
const m=vn(x*.09+40,y*.09+40),t=n<.37?0:n<.42?1:n<.45?2:n>.74?6:m>.8?5:3,s=hs(x,y);map[y*N+x]=t;

mc.fillStyle=mcol[t];mc.fillRect(x,y,1,1)}})();

(function river(){const mc=mm.getContext('2d'),c=N/2,a0=.4;let px=c-Math.cos(a0)*N*.26,py=c-Math.sin(a0)*N*.26,cnt=0;
for(let st=0;st<900;st++){const an=a0+.7*Math.sin(st*.05)+.3*Math.sin(st*.13+1),tx=Math.cos(an),ty=Math.sin(an),ford=Math.sin(st*.09+.5)>.86;px+=tx*.5;py+=ty*.5;if(px<3||py<3||px>N-3||py>N-3)break;
const bx=Math.floor(px),by=Math.floor(py);if(map[by*N+bx]==0&&!RV[by*N+bx]){if(++cnt>8)break}else cnt=0;
for(let yy=-3;yy<=3;yy++)for(let xx=-3;xx<=3;xx++){const ix=bx+xx,iy=by+yy;if(ix<0||iy<0||ix>=N||iy>=N)continue;const dd=Math.hypot(ix+.5-px,iy+.5-py),i=iy*N+ix,s2=hs(ix,iy);
if(dd<=1.35&&!ford){map[i]=0;col[i]='hsl(198,62%,'+(34+s2*5)+'%)';mc.fillStyle='#2f86b8';mc.fillRect(ix,iy,1,1);FX[i]=tx*62;FY[i]=ty*62;RV[i]=1}
else if(dd<=2.3){if(map[i]==0)continue;map[i]=1;col[i]='hsl(190,52%,'+(50+s2*5)+'%)';mc.fillStyle='#6ab6d0';mc.fillRect(ix,iy,1,1);FX[i]=tx*(ford?30:38);FY[i]=ty*(ford?30:38);RV[i]=1}}}})();
function flowM(e,dt){const x=e.x/T|0,y=e.y/T|0;if(x<0||y<0||x>=N||y>=N)return;const i=y*N+x;if(RV[i])mv(e,FX[i]*dt,FY[i]*dt)}
let TM=0;
const tile=(x,y)=>{x=x/T|0;y=y/T|0;return x<0||y<0||x>=N||y>=N?6:map[y*N+x]},solid=(x,y)=>tile(x,y)==6;
function mv(e,dx,dy){if(!solid(e.x+dx+Math.sign(dx)*e.r*.6,e.y))e.x+=dx;if(!solid(e.x,e.y+dy+Math.sign(dy)*e.r*.6))e.y+=dy}
function rp(far){let x,y,k=0;do{x=R()*WS;y=R()*WS;k++}while(([2,3,5].indexOf(tile(x,y))<0||(far&&P&&Math.hypot(x-P.x,y-P.y)<500))&&k<500);return[x,y]}
// ---------- МУТАЦИИ ----------
const M=[['Толстая шкура','Броня +25%, скорость −8%',{arm:.25,spd:-.08}],['Усиленные сухожилия','Скорость +12%, здоровье −12%',{spd:.12,hp:-.12}],
['Остеосклероз','Здоровье +25%, скорость −10%',{hp:.25,spd:-.1}],['Гемомания','Урон +30%, регенерация −30%',{dmg:.3,reg:-.3}],
['Ксерофил','Жажда −45%, здоровье −10%',{tdec:-.45,hp:-.1}],['Гиперметаболизм','Голод −35%, урон −12%',{hdec:-.35,dmg:-.12}],
['Лёгкие бегуна','Выносливость +40%, броня −10%',{stm:.4,arm:-.1}],['Регенерация','Лечение +60%, голод +25%',{reg:.6,hdec:.25}]];
const m=k=>{let s=1;P.mu.forEach(i=>s+=M[i][2][k]||0);return s};
const maxhp=()=>(80+160*P.gr/100)*m('hp')*S[P.s].hp;
// ---------- МИР ----------
function mkNpc(k,far){const[x,y]=rp(far),ty=k=='p'?[1,4,0,5][R()*4|0]:[2,6,7,3][R()*4|0],r=[16,24,9,14,22,30,13,15][ty];return{x,y,a:R()*TAU,k,ty,c:k=='p'?['#8a2e2e','#7a3a1e','#5a2a40','#6a2020'][R()*4|0]:S[ty].c,r,hp:r*(k=='p'?9:4),mh:r*(k=='p'?9:4),cd:0,fl:0,wt:0,sp:1,fear:0,ch:0}}
function start(si){const k=S[si].k;P={s:si,sl:[],acd:0,t:{s:0,d:0,a:0,c:0,b:0,g:0},dh:0,pts:0,got:0,age:0,x:0,y:0,a:0,r:8,k,hp:80,st:160,fd:80,wt:75,n:[50,50,50],gr:0,mu:[],cd:0,bt:0,hf:0,dead:false};
let r=0,f=0;for(;!f&&r<50;r++)for(let a=0;a<TAU&&!f;a+=.4){const x=WS/2+Math.cos(a)*r*T,y=WS/2+Math.sin(a)*r*T;if(tile(x,y)==3){P.x=x;P.y=y;f=1}}
npcs=[];for(let i=0;i<70;i++)npcs.push(mkNpc('h',1));for(let i=0;i<11;i++)npcs.push(mkNpc('p',1));
bushes=[];for(let i=0;i<330;i++){const[x,y]=rp(),c=.45+R()*.3,l=.2+R()*.2;bushes.push({x,y,l:60,t:0,r:10,q:[1-c-l,l,c]})}
cars=[];paused=false;tabOn=false;selS=selM=-1;LH='';if(NET)NET.emit('feed',{t:NICK+' родился: '+S[si].n}).catch(()=>{});$('ov').className='';$('ov').innerHTML=''}
function menuOld(){$('ov').innerHTML='<div class="box"><h1>Остров мутантов</h1><p>Выживай, питайся, расти и мутируй. На каждой стадии роста выбирай мутацию: у каждой есть цена. Нутриенты усиливают тело: белки — лечение, липиды — выносливость, углеводы — скорость.</p><button class="o" onclick="start(0)">🦖 Хищник<small>Ешь туши добычи. Кусай травоядных.</small></button><button class="o" onclick="start(1)">🦕 Травоядный<small>Ешь кусты. Беги от хищников.</small></button><p style="margin-top:14px;font-size:12px;opacity:.7">WASD — ходьба, Shift — бег, Пробел — укус, E — есть и пить.</p></div>'}
function pick(){paused=true;const o=[];while(o.length<3&&o.length<M.length-P.mu.length){const i=R()*M.length|0;if(P.mu.indexOf(i)<0&&o.indexOf(i)<0)o.push(i)}
$('ov').innerHTML='<div class="box"><h2>Мутация</h2><p>Тело меняется. Выбери одну.</p>'+o.map(i=>'<button class="o" onclick="take('+i+')">'+M[i][0]+'<small>'+M[i][1]+'</small></button>').join('')+'</div>'}
function take(i){P.mu.push(i);P.hp=Math.min(maxhp(),P.hp+30);paused=false;$('ov').innerHTML=''}
function die(){if(P.carry)relC(0);P.dead=true;paused=true;netDie();$('ov').innerHTML='<div class="box"><h2>Вы погибли</h2><p>Рост: '+(P.gr|0)+'%. Мутаций: '+P.mu.length+'.</p><button class="o" onclick="menu()">Родиться заново</button></div>'}
function hurt(d){if(P.dead)return;P.hp-=d*(1-Math.max(-.3,Math.min(.7,m('arm')-1)))*(P.t.a>0?.3:1);P.hf=.15;if(P.hp<=0)die()}
function bite(){if(paused||P.dead||P.cd>0)return;P.cd=.6;P.bt=.15;P.am=P.dv&&!P.carry?1:0;if(P.dv&&!P.carry)P.dv=0;if(P.carry){const c=P.carry;c.hp-=(P.k?11:18)*S[P.s].dmg*(.5+P.gr/100)*m('dmg')*1.3;c.fl=.12;if(c.hp<=0)killN(c);return}if(pvpHit())return;let b=null,bd=1e9;
npcs.forEach(n=>{const d=Math.hypot(n.x-P.x,n.y-P.y);if(d<P.r*2.4+n.r&&d<bd){b=n;bd=d}});
if(b){P.a=Math.atan2(b.y-P.y,b.x-P.x);b.hp-=(P.k?11:18)*S[P.s].dmg*(.5+P.gr/100)*m('dmg')*(P.am?2:1)*(P.t.d>0?1.25:1)*(P.t.c>0?3:1)*(P.t.g>0?2:1);if(P.t.c>0){P.t.c=0;b.stun=1.5}if(P.t.g>0){P.t.g=0;b.stun=3;b.bl=5}if(P.t.b>0)b.bl=5;b.fl=.12;if(b.k=='h')b.fear=3;else b.ch=1;
if(b.hp<=0){npcs.splice(npcs.indexOf(b),1);cars.push({x:b.x,y:b.y,l:b.k=='p'?220:110,t:100,r:b.r*1.1,q:[.45,.4,.15]});const k=b.k;setTimeout(()=>npcs.push(mkNpc(k,1)),40000)}}}
// ---------- ОБНОВЛЕНИЕ ----------
function upd(dt){const p=P;let ix=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+jv.x,iy=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0)+jv.y,l=Math.hypot(ix,iy);if(l>1){ix/=l;iy/=l;l=1}
